[workspace]
resolver = "2"
members = [
    "crates/pii-abi",
    "crates/pii-core",
    "crates/pii-observe",
    "crates/pii-store",
    "crates/pii-graph",
    "crates/pii-cli",
    "crates/pii-proto",
    "crates/pii-model",
    "crates/pii-net",
    "crates/pii-memory",
    "crates/pii-worker",
    "crates/pii-tools",
    "crates/pii-channels",
    "crates/pii-server",
    "crates/pii-uds",
    "crates/pii-tui",
    "crates/pii-web",
    "crates/pii-mcp",
    "crates/pii-evolve",
    "crates/pii-hal",
    "crates/pii-wasm",
    "crates/pii-learn",
    "xtask",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/bitscrafts/pi-improved"
authors = ["Marcelo Correa <mvcorrea@gmail.com>"]
description = "Pii - terminal coding agent, assistant daemon, automation engine, cognitive layer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = { version = "1", features = ["derive"] }
bitflags = "2.13"
parking_lot = "0.12"
petgraph = "0.8"
redb = "4.2"
toml = "1.1"
blake3 = "1.8"
dunce = "1.0"
tempfile = "3"
tokio = { version = "1.53", default-features = false }
landlock = "0.4"
# Exact pin per the F5.1 pii-tui dependency allowlist (spec phase2 part3,
# commit 09809b8): the allowlist names ratatui=0.30.2 and deps-check enforces it.
ratatui = "=0.30.2"
crossterm = "0.29"
llama-cpp-2 = { version = "0.1.156", default-features = false, features = ["common"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
large_futures = "deny"
large_enum_variant = "deny"
missing_panics_doc = "warn"
missing_errors_doc = "warn"

arithmetic_side_effects = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

# Release profile per pass-1 §4.2 (opus review F16): size-optimised, LTO,
# panic=abort (a panic inside a thread::scope worker must not unwind into the
# scheduler and abort the process without a journal Finished event), stripped.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

# MEASURED 2026-10-17: the dev profile kept FULL debuginfo, which is where the size and much of the time of every gate
# build went — one night produced 42 GB of artefacts and a single step took 960 seconds. Line tables only: a panic still
# reports file:line, which is what we read, and both the compile and the artefacts shrink sharply. Changing the profile
# invalidates the caches once; every build after that is faster.
[profile.dev]
debug = 1

# A perf-tuned profile for local benchmarking (kept separate from release so
# the size-optimised release stays the shipped artifact).
[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = 1
strip = false
panic = "unwind"

