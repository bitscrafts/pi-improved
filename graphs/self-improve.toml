# Spec 363: a finding becomes one spec, the spec becomes one queue row, and the queue runs that row.
#   case → plan → write → enqueue → queue (call, pinned) → report
# `plan` is the planner's model call, `write` puts its draft in exactly one new `specs/<NN>-<slug>.md`; `enqueue` admits it only when it
# passes the lane's two validators, naming the reason otherwise. `queue` is called by pin (spec 255), so the run is one
# run with one journal, and the queue's own `select` claims the next pending row, which is the one `enqueue` added when
# nothing older waits.
#   pii run start self-improve --input '{"finding":"<text>","workdir":"<repo>","base":"<40-hex commit>"}'
# No absolute path and no credential lives in this file: the repository arrives through `input`.
name = "self-improve"
entry = "case"
exit = "report"
caps = ["spawn", "proc", "fs_read", "fs_write", "ledger", "net"]

[limits]
# The queue's own bound is 6 000 000 ms; the planner call and the enqueue add a small allowance on top.
max_wall_ms = 6300000

# The case is the finding text as the run gave it: the input is passed on, so `plan` reads `$.input.finding`.
[[node]]
id = "case"
kind = "transform"
expr = "$.input"

# Spec 392 R3: a planner is a model call. `model` is the planner role, not the workhorse. It holds no write capability.
[[node]]
id = "plan"
kind = "agent"
caps = ["fs_read", "net"]
tools = ["fs_read"]
model = "glm-5.3"
max_turns = 1
system = "You write one spec for the pii repository. Reply with the spec document only: no preamble, no code fence, and no file writes. Do not implement the spec."
prompt = """
Finding: {{input.finding}}
Repository: {{input.workdir}}

Write the spec that fixes this finding.
Use exactly these headings, in this order:
# Spec: <title>
## Requirements (R1., R2., ... each one checkable)
## TDD contract (a table: file | test | assertion)
## Exit Criteria (one line each, exactly: - [ ] `command`)
## Files (one line each, exactly: - `path`)
Every Exit Criteria line is one shell command in backticks. Every Files line names one file path in backticks.
"""

# Spec 363 R1: the one write. The path is `specs/` by construction, and an existing file is never replaced.
[[node]]
id = "write"
kind = "ledger"
op = "spec.write"
caps = ["fs_write"]
finding = "$.input.finding"
workdir = "$.input.workdir"
text = "$.nodes.plan.text"

# Spec 363 R3: admits the written spec as one queue row, refusing a spec that fails the house shape.
[[node]]
id = "enqueue"
kind = "ledger"
op = "queue.put"
caps = ["fs_read"]
spec = "$.nodes.write.spec"
title = "$.nodes.write.title"
workdir = "$.input.workdir"

# Spec 255: the queue graph is inlined, pinned by the digest of graphs/queue.toml as it is on disk.
[[node]]
id = "queue"
kind = "call"
graph = "queue"
sha256 = "694be343762fd5750720ac2d55fc2f79fad814bd10a9af277030f727cbed4abe"
caps = ["spawn", "proc", "fs_read", "fs_write", "ledger"]

[node.in]
workdir = "$.input.workdir"
base = "$.input.base"

# The report names the row the enqueue admitted, and the spec it was written to.
[[node]]
id = "report"
kind = "transform"
expr = "$.nodes.enqueue"

# A refusal ends the run here with the reason the node named.
[[node]]
id = "refused"
kind = "transform"
# `plan`, `write` and `enqueue` refuse on exclusive paths, so whichever arm arrives ends the run.
join = "any"
expr = "$.payload"

[[edge]]
from = "case"
port = "ok"
to = "plan"
kind = "data"

[[edge]]
from = "plan"
port = "ok"
to = "write"
kind = "data"

[[edge]]
from = "plan"
port = "budget"
to = "refused"
kind = "data"

[[edge]]
from = "plan"
port = "fail"
to = "refused"
kind = "data"

[[edge]]
from = "write"
port = "ok"
to = "enqueue"
kind = "data"

[[edge]]
from = "write"
port = "err"
to = "refused"
kind = "data"

[[edge]]
from = "plan"
port = "err"
to = "refused"
kind = "data"

[[edge]]
from = "enqueue"
port = "ok"
to = "queue"
kind = "data"

[[edge]]
from = "enqueue"
port = "err"
to = "refused"
kind = "data"

[[edge]]
from = "queue"
port = "ok"
to = "report"
kind = "data"
