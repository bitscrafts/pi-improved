# Spec 257: one tracked graph implements any spec. The run input chooses the agent, model, spec, workdir and brief:
#   pii run start spec --input '{"agent":"pi","model":"<model>","provider":"<provider>","spec":"specs/N-x.md","workdir":"<dir>","brief":"<text>"}'
# No absolute path and no credential lives in this file: only the NAMES in env_pass are copied from the daemon's environment.
name = "spec"
entry = "code"
# Spec 364: named so the queue can inline this graph by `call`. A host routes on `done`'s ports, and may wire a refusal
# by name (`<call>.unverified`, `<call>.refused`) to take it back as a verdict; run directly, a refusal fails the run.
exit = "done"
caps = ["spawn", "proc", "fs_read", "fs_write"]

# Spec 282: the run's spend bound, which the coder charges (spec 276). Measured basis: one full spec pass through the
# queue's daemon cost claude_cost_usd = 0.070610 (run r000000000130); 1.00 USD is about fourteen such passes. A `call`
# (the docs graph) is inlined and shares this budget.
[limits]
max_micro_usd = 1000000
# Spec 290: the wall covers the coders. `code` 3 000 000 + the inlined docs coder 1 200 000, plus 1 800 000 for the two judges
# (a stated allowance: judge_spec.rs has no timeout to measure) and the call's steps. The default 600 000 failed real passes
# at `verify` with the agent's work done and exit 0 (r000000000261: 601 s, r000000000260: 717 s).
max_wall_ms = 6000000

[[node]]
id = "code"
kind = "coder"
caps = ["spawn", "proc", "fs_read", "fs_write"]
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"
workdir = "$.input.workdir"
brief = "$.input.brief"
max_budget_usd = "$.input.max_budget_usd"
# Spec 303: the resumed session. Optional: absent (or null) in the input means a fresh session, as the one-node graph's coder has it.
sid = "$.input.sid"
timeout_ms = 3000000
env_pass = ["PATH", "HOME", "IS_SANDBOX", "OLLAMA_API_KEY", "PI_CODING_AGENT_DIR", "CLAUDE_CODE_TMPDIR", "CLAUDE_CONFIG_DIR"]

[[node]]
id = "verify"
kind = "judge"
caps = ["proc"]
spec = "$.input.spec"
base = "$.input.base"
workdir = "$.input.workdir"

# Spec 272: after `verify` passes, the docs graph documents the work (its own session, its own brief), then `reverify`
# judges the same criteria again: a docs step that broke them is refused. The pin is the digest of graphs/docs.toml.
[[node]]
id = "docs"
kind = "call"
graph = "docs"
sha256 = "b7f8eacdb79aa051070046e19ca1e6c0527fde72f0df0383b08c0c192e020980"
caps = ["spawn", "proc"]

# Spec 364: mapped, because a holder that is itself called must supply what docs `needs` (spec 261 R8).
[node.in]
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"
workdir = "$.input.workdir"
brief = "$.input.docs_brief"

[[node]]
id = "reverify"
kind = "judge"
caps = ["proc"]
spec = "$.input.spec"
base = "$.input.base"
workdir = "$.input.workdir"

[[node]]
id = "done"
kind = "transform"
value = "done"

# Spec 272: `unverified` and `refused` take a route from two exclusive ports (verify or reverify; code or docs), so their
# join is `any`: whichever arm arrives ends the run.
[[node]]
id = "unverified"
kind = "refuse"
join = "any"
hook = "judge"
reason = "the spec's criteria failed"

[[node]]
id = "refused"
kind = "refuse"
join = "any"
hook = "coder"
reason = "the agent failed"

[[edge]]
from = "code"
port = "ok"
to = "verify"
kind = "data"

[[edge]]
from = "verify"
port = "ok"
to = "docs"
kind = "data"

[[edge]]
from = "docs"
port = "ok"
to = "reverify"
kind = "data"

[[edge]]
from = "docs"
port = "err"
to = "refused"
kind = "data"

[[edge]]
from = "reverify"
port = "ok"
to = "done"
kind = "data"

[[edge]]
from = "reverify"
port = "fail"
to = "unverified"
kind = "data"

[[edge]]
from = "verify"
port = "fail"
to = "unverified"
kind = "data"

[[edge]]
from = "code"
port = "err"
to = "refused"
kind = "data"
