# Spec 257: one tracked graph implements any spec. The run input chooses the agent, model, spec, workdir and brief:
#   pii run start spec --input '{"agent":"pi","model":"<model>","provider":"<provider>","spec":"specs/N-x.md","workdir":"<dir>","brief":"<text>"}'
# No absolute path and no credential lives in this file: only the NAMES in env_pass are copied from the daemon's environment.
# Spec 385: `spec` is a DRIVER. It holds no coder and no judge of its own: it routes on the methodology, calls ONE of two
# pinned methodology graphs (`sdd`: RED before GREEN; `method-judge`: implement, then judge), then documents the work and
# re-judges the criteria. The run input may name the methodology as `method`: "sdd" or "method-judge". Without it, the
# fallback is `method-judge`. Each call is pinned, so a review of a pin is a review of a specific file.
name = "spec"
entry = "pick"
# Spec 364: named so the queue can inline this graph by `call`. A host routes on `done`'s ports, and may wire a refusal
# by name (`<call>.unverified`, `<call>.refused`) to take it back as a verdict; run directly, a refusal fails the run.
exit = "done"
caps = ["spawn", "proc", "fs_read", "fs_write"]

# Spec 282: the run's spend bound, which the coder charges (spec 276). Measured basis: one full spec pass through the
# queue's daemon cost claude_cost_usd = 0.070610 (run r000000000130); 1.00 USD is about fourteen such passes. A `call`
# (the docs graph) is inlined and shares this budget.
[limits]
max_micro_usd = 1000000
# Spec 290: the wall covers the methodology call (`sdd` runs two coders, its tdd allowance is 4 200 000) or `method-judge`
# (one coder, 3 000 000), plus the inlined docs coder 1 200 000 and the call's steps. The default 600 000 failed real
# passes at `verify` with the agent's work done and exit 0 (r000000000261: 601 s, r000000000260: 717 s).
max_wall_ms = 10800000   # 3 h: the two coders reached through the methodology sum to 7.8 M ms;
                           # the wall must cover them plus the docs step, and it is a literal on purpose

# Spec 385 R6: the methodology is chosen from the run input. An input `method` of "sdd" routes to the RED/GREEN graph;
# anything else (absent, or "method-judge") routes to the judge graph.
[[node]]
id = "pick"
kind = "route"
on = "$.input.method"
rules = [
  { eq = "sdd", port = "sdd" },
  { port = "method-judge" },
]

# Spec 385 R2: the RED/GREEN methodology, pinned. Its `ok` is every criterion GREEN.
[[node]]
id = "sdd"
kind = "call"
graph = "sdd"
sha256 = "3124cca3cf9848786964f11460e10a9a0366472691c5d9e22b2b298cb2c43901"
caps = ["spawn", "proc", "fs_read", "fs_write"]

[node.in]
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"
workdir = "$.input.workdir"
base = "$.input.base"
brief = "$.input.brief"

# Spec 385 R3: the judge methodology, pinned. Its `ok` is the criteria judged passing.
[[node]]
id = "method-judge"
kind = "call"
graph = "method-judge"
sha256 = "89a04519c0852dd1ed85da7793d47964f38634ba4fd950ce9367fd3d62a08243"
caps = ["spawn", "proc", "fs_read", "fs_write"]

[node.in]
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"
workdir = "$.input.workdir"
base = "$.input.base"
brief = "$.input.brief"

# Spec 385: either methodology's `ok` reaches `passed`, which joins on whichever arrives (the two are exclusive).
[[node]]
id = "passed"
kind = "transform"
join = "any"
expr = "$.payload"

# Spec 272: after a methodology passes, the docs graph documents the work (its own session, its own brief), then `reverify`
# judges the same criteria again: a docs step that broke them is refused. The pin is the digest of graphs/docs.toml.
[[node]]
id = "docs"
kind = "call"
graph = "docs"
sha256 = "b7f8eacdb79aa051070046e19ca1e6c0527fde72f0df0383b08c0c192e020980"
caps = ["spawn", "proc"]

# Spec 364: mapped, because a holder that is itself called must supply what docs `needs` (spec 261 R8).
[node.in]
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"
workdir = "$.input.workdir"
brief = "$.input.docs_brief"

[[node]]
id = "reverify"
kind = "judge"
caps = ["proc"]
spec = "$.input.spec"
base = "$.input.base"
workdir = "$.input.workdir"

[[node]]
id = "done"
kind = "transform"
value = "done"

# Spec 272: `unverified` and `refused` take a route from two exclusive ports (a methodology or reverify; docs), so their
# join is `any`: whichever arm arrives ends the run.
[[node]]
id = "unverified"
kind = "refuse"
join = "any"
hook = "judge"
reason = "the spec's criteria failed"

[[node]]
id = "refused"
kind = "refuse"
join = "any"
hook = "coder"
reason = "the agent failed"

[[edge]]
from = "pick"
port = "sdd"
to = "sdd"
kind = "data"

[[edge]]
from = "pick"
port = "method-judge"
to = "method-judge"
kind = "data"

[[edge]]
from = "sdd"
port = "ok"
to = "passed"
kind = "data"

[[edge]]
from = "method-judge"
port = "ok"
to = "passed"
kind = "data"

[[edge]]
from = "passed"
port = "ok"
to = "docs"
kind = "data"

# Spec 381 R3 / 385: both methodologies can refuse or leave their criteria unverified, and the driver says which.
[[edge]]
from = "sdd"
port = "unverified"
to = "unverified"
kind = "data"

[[edge]]
from = "sdd"
port = "refused"
to = "refused"
kind = "data"

[[edge]]
from = "method-judge"
port = "unverified"
to = "unverified"
kind = "data"

[[edge]]
from = "method-judge"
port = "refused"
to = "refused"
kind = "data"

[[edge]]
from = "docs"
port = "ok"
to = "reverify"
kind = "data"

[[edge]]
from = "docs"
port = "err"
to = "refused"
kind = "data"

[[edge]]
from = "reverify"
port = "ok"
to = "done"
kind = "data"

[[edge]]
from = "reverify"
port = "fail"
to = "unverified"
kind = "data"
