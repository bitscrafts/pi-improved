sha256 = "1d98e385b5120f34587eac8de848e43733c29bb3c39f25876b699b01e8c4acd3"
caps = ["fs_read", "proc"]

[node.in]
doc = "$.input.doc"
rubric = "$.nodes.pick_3"
workdir = "$.input.workdir"
