graph = "review-one"
sha256 = "1d98e385b5120f34587eac8de848e43733c29bb3c39f25876b699b01e8c4acd3"
caps = ["fs_read", "proc"]

[node.in]
doc = "$.input.doc"
rubric = "$.nodes.pick_4"
workdir = "$.input.workdir"
model = "$.input.model"
provider = "$.input.provider"

[[node]]
id = "pass_4"
kind = "transform"
value = "passed"

[[node]]
id = "failed_4"
kind = "transform"
join = "any"
expr = '"rubric " + $.input.rubric_4 + " did not pass"'

# Join of this slot's arms: exactly one arm fires, the others are dead, so the join is `any` and it keys its payload by arm.
[[node]]
id = "res_4"
kind = "transform"
expr = "$.payload"
join = "any"

# One route for the four slots, fed by every `res_N` (each is keyed by its source). A slot that failed refuses the run; a
# passed or skipped slot does not. `join = "all"` waits for all four, so no slot is judged before it has answered.
[[node]]
id = "check"
kind = "route"
on = "$.payload"
join = "all"
rules = [
  { when = '$.payload.res_1.failed_1 != $.nodes.none', port = "refuse" },
  { when = '$.payload.res_2.failed_2 != $.nodes.none', port = "refuse" },
  { when = '$.payload.res_3.failed_3 != $.nodes.none', port = "refuse" },
  { when = '$.payload.res_4.failed_4 != $.nodes.none', port = "refuse" },
  { port = "next" },
]

[[node]]
id = "done"
kind = "transform"
value = "done"

# One refusal for every slot that did not pass. The reason names each failing rubric: the join's payload is each slot's
# arm, and a passed slot's arm carries only "passed", so the rubric names in it are exactly the failing ones. Its id is
# the host's: the reviewer's own verdicts are in the journal under each slot.
[[node]]
id = "refuse"
kind = "refuse"
join = "any"
hook = "review"
reason = "a requested rubric did not pass: {{payload}}"

# A review with no `rubric_1` is refused by its own node: no slot ran, so there is no arm to name.
[[node]]
id = "refuse_none"
kind = "refuse"
hook = "review"
reason = "rubric_1 was not given: a review with no reviewer is not a pass"

# The need edges and gate edges start a slot; a skipped slot feeds its arm to the join.
[[edge]]
from = "need_1"
port = "run"
to = "slot_1"
kind = "data"

[[edge]]
from = "need_1"
port = "refuse"
to = "refuse_none"
kind = "data"

