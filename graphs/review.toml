# Spec 403: the fan-out. Four named reviewer slots, each a pinned call of `review-one`. A slot whose `rubric_N` is absent is
# skipped: neither a pass nor a failure. Port `ok` only when every requested slot passed; otherwise the run is refused. A
# slot's refusal is taken back from its call by wiring the refusal's id (`refuse`), so one reviewer's refusal does not end
# the run before the others have answered. `rubric_1` is required: a review with no reviewer is not a pass. No absolute
# path, credential, model name or rubric text lives in this file.
name = "review"
entry = "need_1"
exit = "done"
needs = ["doc", "workdir", "model", "provider"]
caps = ["fs_read", "fs_write", "proc"]

[limits]
max_wall_ms = 1800000

# An absent path resolves to null, which no string or number equals: that is how a slot tells "absent" from "given".
[[node]]
id = "need_1"
kind = "route"
on = "$.input.rubric_1"
rules = [
  { when = '$.input.rubric_1 == $.nodes.none', port = "refuse" },
  { port = "run" },
]

# The rubric is read through a host transform: a `call` input that names an absent run-input key is refused at start,
# and a slot whose rubric is absent is skipped by its gate before this call ever runs.
[[node]]
id = "pick_1"
kind = "transform"
expr = "$.input.rubric_1"

[[node]]
id = "slot_1"
kind = "call"
graph = "review-one"
sha256 = "1d98e385b5120f34587eac8de848e43733c29bb3c39f25876b699b01e8c4acd3"
caps = ["fs_read", "proc"]

[node.in]
doc = "$.input.doc"
rubric = "$.nodes.pick_1"
workdir = "$.input.workdir"
model = "$.input.model"
provider = "$.input.provider"

[[node]]
id = "pass_1"
kind = "transform"
value = "passed"

[[node]]
id = "failed_1"
kind = "transform"
join = "any"
expr = '"rubric " + $.input.rubric_1 + " did not pass"'

# Join of this slot's arms: exactly one arm fires, the others are dead, so the join is `any` and it keys its payload by arm.
[[node]]
id = "res_1"
kind = "transform"
expr = "$.payload"
join = "any"

[[node]]
id = "gate_2"
kind = "route"
on = "$.input.rubric_2"
rules = [
  { when = '$.input.rubric_2 == $.nodes.none', port = "skip" },
  { port = "run" },
]

[[node]]
id = "skip_2"
kind = "transform"
value = "skipped"

# The rubric is read through a host transform: a `call` input that names an absent run-input key is refused at start,
# and a slot whose rubric is absent is skipped by its gate before this call ever runs.
[[node]]
id = "pick_2"
kind = "transform"
expr = "$.input.rubric_2"

[[node]]
id = "slot_2"
kind = "call"
graph = "review-one"
sha256 = "1d98e385b5120f34587eac8de848e43733c29bb3c39f25876b699b01e8c4acd3"
caps = ["fs_read", "proc"]

[node.in]
doc = "$.input.doc"
rubric = "$.nodes.pick_2"
workdir = "$.input.workdir"
model = "$.input.model"
provider = "$.input.provider"

[[node]]
id = "pass_2"
kind = "transform"
value = "passed"

[[node]]
id = "failed_2"
kind = "transform"
join = "any"
expr = '"rubric " + $.input.rubric_2 + " did not pass"'

# Join of this slot's arms: exactly one arm fires, the others are dead, so the join is `any` and it keys its payload by arm.
[[node]]
id = "res_2"
kind = "transform"
expr = "$.payload"
join = "any"

[[node]]
id = "gate_3"
kind = "route"
on = "$.input.rubric_3"
rules = [
  { when = '$.input.rubric_3 == $.nodes.none', port = "skip" },
  { port = "run" },
]

[[node]]
id = "skip_3"
kind = "transform"
value = "skipped"

# The rubric is read through a host transform: a `call` input that names an absent run-input key is refused at start,
# and a slot whose rubric is absent is skipped by its gate before this call ever runs.
[[node]]
