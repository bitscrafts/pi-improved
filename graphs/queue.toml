# Spec 208: the development queue as a graph. `select` gates the next work item (blocked and empty are reported
# apart, and a blocked select ends the run on its own port with the edge it waits on); `dispatch` is a coder
# node that works the selected item's spec; `judge` runs the item's criteria; `record` writes the verdict to the
# item's status in the queue store. A worker never commits: that stays an operator act.
name = "queue"
entry = "select"
# Spec 343 R6: declared so the graph can be inlined by `call`, which routes the host on the exit node's ports.
exit = "record"
caps = ["spawn", "proc", "fs_read", "fs_write"]

[limits]
# The 600000 ms default is checked before each next node, and a coder pass past ten minutes was failed with its work complete
# (measured on the daemon: 601 s and 717 s); the coder's 1800000 plus the judge's 1800000 allowance is 3600000.
max_wall_ms = 3600000

[[node]]
id = "select"
kind = "select"

[[node]]
id = "dispatch"
kind = "coder"
# spec 362: a coder without fs_write cannot implement anything — measured 2026-11-03, the agent spawned with these caps
# stopped and reported "no write or execute tool is available" instead of writing code.
caps = ["spawn", "proc", "fs_read", "fs_write"]
agent = "pi"
model = "deepseek-v4.1-flash:cloud"
provider = "ollama-cloud"
workdir = "$.input.workdir"
# spec 362: the claimed row carries the spec; without this the coder has no document to implement and
# improvises (measured 2026-11-03: it wrote the WRONG spec's test files while its row said otherwise).
spec = "$.nodes.select.item.spec"
brief = "Implement the spec named above. Follow it as the contract. Do not commit. If a criterion cannot pass, stop and say why instead of weakening it."
timeout_ms = 1800000
env_pass = ["PATH", "HOME", "IS_SANDBOX", "OLLAMA_API_KEY", "PI_CODING_AGENT_DIR", "CLAUDE_CONFIG_DIR", "CLAUDE_CODE_TMPDIR"]

[[node]]
id = "judge"
kind = "judge"
caps = ["proc"]
workdir = "$.input.workdir"
# improvises (measured 2026-11-03: it wrote the WRONG spec's test files while its row said otherwise).

[[node]]
id = "record"
kind = "record"
# Any one verdict arrives: a judge pass, a judge failure, or a refused dispatch. These ports are exclusive.
join = "any"

[[edge]]
from = "select"
port = "ok"
to = "dispatch"
kind = "data"

[[edge]]
from = "dispatch"
port = "ok"
to = "judge"
kind = "data"

[[edge]]
from = "dispatch"
port = "err"
to = "record"
kind = "data"

[[edge]]
from = "judge"
port = "ok"
to = "record"
kind = "data"

[[edge]]
from = "judge"
port = "fail"
to = "record"
kind = "data"

# Spec 342 R5: exhaustion leaves through the exit. A night (a host) reaches only `record`'s ports, so an empty or blocked
# select is carried into `record`, which emits the status on its ok port and writes nothing to the store.
[[edge]]
from = "select"
port = "empty"
to = "record"
kind = "data"

[[edge]]
from = "select"
port = "blocked"
to = "record"
kind = "data"
