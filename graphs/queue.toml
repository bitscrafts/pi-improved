# Spec 208: the development queue as a graph. `select` gates the next work item (blocked and empty are reported
# apart, and a blocked select ends the run on its own port with the edge it waits on); `implement` calls the spec graph
# on the selected item's spec; `record` writes the callee's verdict to the item's status in the queue store. A worker
# never commits: that stays an operator act.
#   pii run start queue --input '{"workdir":"<repo>","base":"<40-hex commit holding the row's spec>"}'
name = "queue"
entry = "select"
# Spec 343 R6: declared so the graph can be inlined by `call`, which routes the host on the exit node's ports.
exit = "record"
caps = ["spawn", "proc", "fs_read", "fs_write", "ledger"]

[limits]
# Spec 364: the called spec graph's own bound, because a call shares its host's wall (see graphs/spec.toml).
max_wall_ms = 6000000

[[node]]
id = "select"
kind = "ledger"
op = "queue.claim"

# Spec 364: one implementation of "implement a spec". The callee's `verify` and `reverify` own the verdict, so the row's
# own criteria are not run here. The pin is the digest of graphs/spec.toml.
[[node]]
id = "implement"
kind = "call"
graph = "spec"
sha256 = "8f7607dd95cfb0cbca67fc883c46511887348bf830090f7071428d2603b6c91d"
# spec 362: a coder without fs_write cannot implement anything — measured 2026-11-03, the agent spawned with these caps
# stopped and reported "no write or execute tool is available" instead of writing code.
caps = ["spawn", "proc", "fs_read", "fs_write"]

[node.in]
agent = "pi"
model = "deepseek-v4.1-flash:cloud"
provider = "ollama-cloud"
workdir = "$.input.workdir"
base = "$.input.base"
# spec 362: the claimed row carries the spec; without this the coder has no document to implement and
# improvises (measured 2026-11-03: it wrote the WRONG spec's test files while its row said otherwise).
spec = "$.nodes.select.item.spec"
# The row's own brief, from the run input (spec 385 dropped this plumbing and every row of a night
# carried the same words). A run started by hand without one falls back to the spec alone.
brief = "$.input.brief"
docs_brief = "Document the work the spec named above just added. Change documentation only."

[[node]]
id = "record"
kind = "ledger"
op = "queue.set_status"
# Any one verdict arrives: the callee's done, one of its refusals, or an exhausted select. These ports are exclusive.
join = "any"

[[edge]]
from = "select"
port = "ok"
to = "implement"
kind = "data"

[[edge]]
from = "implement"
port = "ok"
to = "record"
kind = "data"

# Spec 364: the callee's refusals, wired by name, so a refused implementation parks the row instead of ending the run
# with the row still claimed.
[[edge]]
from = "implement"
port = "unverified"
to = "record"
kind = "data"

[[edge]]
from = "implement"
port = "refused"
to = "record"
kind = "data"

# Spec 342 R5: exhaustion leaves through the exit. A night (a host) reaches only `record`'s ports, so an empty or blocked
# select is carried into `record`, which emits the status on its ok port and writes nothing to the store.
[[edge]]
from = "select"
port = "empty"
to = "record"
kind = "data"

[[edge]]
from = "select"
port = "blocked"
to = "record"
kind = "data"

# Spec 381 R2: a row another run holds is a verdict. `record` reports it as `running` and writes nothing to the store.
[[edge]]
from = "select"
port = "running"
to = "record"
kind = "data"
