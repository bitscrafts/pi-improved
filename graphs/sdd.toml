# Spec 373: the SDD loop as a graph. A spec is the contract. `contract` proves its criteria are present and runnable
# (each fails before the code exists). `tdd` (a called graph, spec 372) writes the tests, proves them RED, implements and
# proves them GREEN. `verify` re-judges the criteria. Spec 385: the docs step is owned by the driver (`spec`), so this
# graph ends at `verify`. Three verdicts end the run: `done`, `unverified` (the criteria fail) and `refused` (the run
# could not proceed). No absolute path and no credential lives in this file. `exit = "done"` lets a host call this graph.
name = "sdd"
entry = "contract"
exit = "done"
needs = ["agent", "model", "provider", "spec", "workdir", "base", "brief"]
caps = ["spawn", "proc", "fs_read", "fs_write"]

[limits]
max_steps = 1000
max_wall_ms = 5400000   # 1.5 h: two coders at 1.8 M each plus the four judges between them

[[node]]
id = "contract"
kind = "judge"
caps = ["proc"]
spec = "$.input.spec"
base = "$.input.base"
workdir = "$.input.workdir"
# Every criterion must fail before the code exists: `ok` when all fail, `unrunnable` when one cannot run.
expect = "fail"

# Spec 372: the TDD loop, pinned. Its exit is `green`, so `ok` is every test GREEN and `fail` is a test still RED.
[[node]]
id = "verify"
kind = "judge"
caps = ["proc"]
spec = "$.input.spec"
base = "$.input.base"
workdir = "$.input.workdir"

[[node]]
id = "done"
kind = "transform"
value = "done"

# `unverified` and `refused` take a route from exclusive ports, so their join is `any`: whichever arm arrives ends the run.
[[node]]
id = "unverified"
kind = "refuse"
join = "any"
hook = "judge"
reason = "the spec's criteria failed"

[[node]]
id = "refused"
kind = "refuse"
join = "any"
hook = "coder"
reason = "the agent failed or the criteria could not run"

[[edge]]
from = "contract"
port = "fail"
to = "refused"
kind = "data"

[[edge]]
from = "contract"
port = "unrunnable"
to = "refused"
kind = "data"

[[edge]]
from = "verify"
port = "ok"
to = "done"
kind = "data"

[[edge]]
from = "verify"
port = "fail"
to = "unverified"
kind = "data"

[[node]]
id = "tdd_write_test"
kind = "coder"
caps = ["spawn", "proc", "fs_read", "fs_write"]
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"
workdir = "$.input.workdir"
brief = "Write only the tests that the spec's Exit Criteria name. Do NOT write the implementation: the tests must fail against the code as it is. Do not commit."
timeout_ms = 1800000
env_pass = ["PATH", "HOME", "IS_SANDBOX", "OLLAMA_API_KEY", "PI_CODING_AGENT_DIR", "CLAUDE_CODE_TMPDIR", "CLAUDE_CONFIG_DIR"]

[[node]]
id = "tdd_red"
kind = "judge"
caps = ["proc"]
spec = "$.input.spec"
base = "$.input.base"
workdir = "$.input.workdir"
expect = "fail"

[[node]]
id = "tdd_implement"
kind = "coder"
caps = ["spawn", "proc", "fs_read", "fs_write"]
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"
workdir = "$.input.workdir"
brief = "$.input.brief"
# The literal above was the only brief the coder ever saw: spec 385 made the implementer a call and
# dropped the row's own brief, so every row of a night carried the same words. The caller passes it now;
# this is the fallback for a run started by hand.
unused_literal_brief = "Implement the spec named above until its tests pass. Follow it as the contract. Do not edit the tests to make them pass. Do not commit. If a criterion cannot pass, stop and say why instead of weakening it."
timeout_ms = 1800000
env_pass = ["PATH", "HOME", "IS_SANDBOX", "OLLAMA_API_KEY", "PI_CODING_AGENT_DIR", "CLAUDE_CODE_TMPDIR", "CLAUDE_CONFIG_DIR"]

[[node]]
id = "tdd_green"
kind = "judge"
caps = ["proc"]
spec = "$.input.spec"
base = "$.input.base"
workdir = "$.input.workdir"

[[node]]
id = "tdd_done"
kind = "transform"
value = "done"

# The two ways the loop goes wrong, and the coder refusals. Each is its own terminal port, so the run says which one.

[[node]]
id = "tdd_refused"
kind = "refuse"
join = "any"
hook = "coder"
reason = "the agent failed"

[[node]]
id = "tdd_not-red"
kind = "refuse"
join = "all"
hook = "judge"
reason = "the test passed before the code existed, so it proves nothing"

[[node]]
id = "tdd_unrunnable"
kind = "refuse"
join = "all"
hook = "judge"
reason = "a criterion could not run, so RED is unproven"

[[node]]
id = "tdd_still-red"
kind = "refuse"
join = "all"
hook = "judge"
reason = "the implementation did not make the test pass"

[[edge]]
from = "tdd_write_test"
port = "ok"
to = "tdd_red"
kind = "data"

[[edge]]
from = "tdd_write_test"
port = "err"
to = "tdd_refused"
kind = "data"

[[edge]]
from = "tdd_red"
port = "ok"
to = "tdd_implement"
kind = "data"

[[edge]]
from = "tdd_red"
port = "fail"
to = "tdd_not-red"
kind = "data"

[[edge]]
from = "tdd_red"
port = "unrunnable"
to = "tdd_unrunnable"
kind = "data"

[[edge]]
from = "tdd_implement"
port = "ok"
to = "tdd_green"
kind = "data"

[[edge]]
from = "tdd_implement"
port = "err"
to = "tdd_refused"
kind = "data"

[[edge]]
from = "tdd_green"
port = "ok"
to = "tdd_done"
kind = "data"

[[edge]]
from = "tdd_green"
port = "fail"
to = "tdd_still-red"
kind = "data"

# the test-first flow is INLINE (spec 385): calling tdd made night -> queue -> spec -> sdd -> tdd,
# five deep against a cap of four. A merge is an inline, not a call.
[[edge]]
from = "contract"
port = "ok"
to = "tdd_write_test"
kind = "data"

[[edge]]
from = "tdd_green"
port = "ok"
to = "verify"
kind = "data"

[[edge]]
from = "tdd_green"
port = "fail"
to = "unverified"
kind = "data"
