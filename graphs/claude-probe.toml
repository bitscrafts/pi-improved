# Claude + haiku probe through pii: ONE turn, hard-capped, scratch workdir. No criteria, so the verdict is the exit code.
# Credential: claude reads its own login file through HOME (env_pass carries the NAME only; no value lives here).
name = "claude-probe"
entry = "code"
caps = ["spawn", "proc"]

[[node]]
id = "code"
kind = "coder"
caps = ["spawn", "proc"]
agent = "claude"
model = "haiku"
workdir = "/projects/pi-improved/_tmp/claude-probe-work"
spec = "specs/207-the-coder-node-spawns-an-agent.md"
brief = "Reply with the single word PONG and nothing else. Do not use any tools."
env_pass = ["PATH", "HOME", "IS_SANDBOX"]
max_budget_usd = 0.30
timeout_ms = 180000

[[node]]
id = "done"
kind = "transform"
value = "done"

[[node]]
id = "refused"
kind = "transform"
value = "refused"

[[edge]]
from = "code"
port = "ok"
to = "done"
kind = "data"

[[edge]]
from = "code"
port = "err"
to = "refused"
kind = "data"
