# Boss watch (spec 27): the self-improving boss's WATCH loop as a real pii
# graph run on the daemon — dogfooding (008 §3/§4). Every 30 min it runs the
# silent-noop-check gate (spec 24) on the daemon itself; a detected failure
# escalates through a `gate` node so a human approves before anything heals.
# No FS_WRITE anywhere in this graph (`heal.observe` is read-only detection; the
# gate node itself is PURE). No `agent`/model node anywhere — detection,
# forwarding, and the approval decision are all deterministic nodes; the
# boss's "decide what to do next with a model" is a later spec. Periodicity
# is the daemon scheduler's timer wheel (F5.6), not an in-process loop.
name = "starter/boss-watch"
entry = "tick"
caps = ["proc", "ledger"]

[limits]
max_steps = 1000
max_wall_ms = 600000

[[node]]
id = "tick"
kind = "timer"
cron = "*/30 * * * *"

[[node]]
id = "check"
kind = "ledger"
op = "heal.observe"
gate = "silent-noop-check"
caps = ["proc"]

# Spec 392 R6: detection is a comparison. Reproducible means both runs really failed: one failure is a flake, and a
# timeout is inconclusive, never a failure (doc 064, D2).
[[node]]
id = "detect"
kind = "transform"
expr = "$.payload.failures == 2"

[[node]]
id = "decide"
kind = "route"
on = "$.payload"
rules = [
  { eq = true, port = "detected" },
  { port = "clear" },
]

# ONE ledger row per reproducible failure, on the detected arm only.
[[node]]
id = "record"
kind = "ledger"
op = "heal.record_run"
signature = "$.nodes.check.signature_hash"
gate = "$.nodes.check.gate"
detail = "$.nodes.check.detail"

# `cyc` is LOAD-BEARING (spec 26 R1, A17a): `gate` reads `input.payload.cycle`
# at runtime. `record`'s value is `{signature_hash, detail}`
# with NO `cycle`, so without this node the gate falls back to `cfg.cycle=0`,
# finds its cached decision, and auto-allows. `expr = "$.input"` forwards the
# run's root input (which carries `cycle`) as the gate's payload — this is
# the only working form; `transform`'s `value` cannot build a merged object,
# only evaluate a single top-level `"$."` string.
[[node]]
id = "cyc"
kind = "transform"
expr = "$.input"

[[node]]
id = "escalate"
kind = "gate"
policy = "boss-escalation"
prompt = "Boss detected silent-noop-check failure. Approve promotion/heal attempt?"
deadline_ms = 600000

[[node]]
id = "done"
kind = "transform"
join = "any"
value = "no-silent-noop"

[[edge]]
from = "tick"
port = "fired"
to = "check"
kind = "data"

[[edge]]
from = "check"
port = "ok"
to = "detect"
kind = "data"

[[edge]]
from = "detect"
port = "ok"
to = "decide"
kind = "data"

[[edge]]
from = "decide"
port = "clear"
to = "done"
kind = "data"

[[edge]]
from = "decide"
port = "detected"
to = "record"
kind = "data"

[[edge]]
from = "record"
port = "ok"
to = "cyc"
kind = "data"

[[edge]]
from = "cyc"
port = "ok"
to = "escalate"
kind = "data"

[[edge]]
from = "escalate"
port = "allow"
to = "done"
kind = "data"

[[edge]]
from = "escalate"
port = "deny"
to = "done"
kind = "data"
