# Slice-1 heal-fix graph (S1.3): localize -> patch -> validate -> escalate.
# Runs in a disposable worktree; the run's ctx fs_write PathScope IS the
# worktree (scope_root in run input) — confinement is a capability, not a
# policy. The fix agent has fs/edit tools ONLY (NO bash): every write it
# makes goes through Ctx::fs() and is mechanically bound to the worktree.
# `run` executes an argv in `tool` nodes, from human-authored graph argv arrays (spec 399): no shell.
# Nothing auto-resumes: the terminal step suspends on a `gate` node for
# human approval; a patch leaves the sandbox only via `xtask heal-collect`.
name = "starter/heal-fix"
entry = "probe"
caps = ["fs_read", "fs_write", "proc", "ledger"]

[limits]
max_steps = 1000
max_wall_ms = 600000
max_tokens = 20000

# --- localize: run the seeded failing test in the worktree (compiler gives file:line) ---
[[node]]
id = "probe"
kind = "tool"
tool = "run"
programs = ["cargo"]
args = { argv = "$.input.test_argv", cwd = "$.input.worktree" }

[[node]]
id = "route_probe"
kind = "route"
on = "$.payload.exit_code"
rules = [
  { eq = 0, port = "ok" },
  { port = "broken" },
]

# A seeded break that did NOT reproduce is itself an anomaly — human eyes.
[[node]]
id = "unexpected_ok"
kind = "gate"
policy = "heal-escalation"
prompt = "heal-fix: the seeded break did not reproduce (probe exited 0). Nothing to repair; review before closing."
deadline_ms = 600000

# --- patch: agent confined to the worktree (no bash tool) ---
[[node]]
id = "fix"
kind = "agent"
# Two inbound branches (first detection via route_probe, retry via retry.ok)
# must each be able to fire the node alone — verify-fix's entry special-case
# doesn't apply here, so this needs an explicit Any join.
join = "any"
loop_budget = 2
max_turns = 6
tools = ["fs_read", "fs_write", "edit", "multi_edit"]
memory = { enabled = false, top_k = 0 }
# R1 (spec 33): the patch model is routed via [evolve.routing], never a
# hardcoded default — resolve_model is loud (NotFound) on an unassigned
# step, so a daemon without `patch` configured refuses to run this graph
# rather than silently falling back to whatever model happens to be default.
route_step = "patch"
system = "You are repairing one deliberately seeded source break in a disposable git worktree. The failing test output is in your input; the compiler's file:line localizes the break. Make the minimal change in the worktree that makes the test pass again (typically restoring one flipped constant). You have fs_read/fs_write/edit/multi_edit only — never attempt shell commands; you cannot run them. Do not touch any file outside the worktree."

# --- validate: re-run the exact same test ---
[[node]]
id = "retest"
kind = "tool"
tool = "run"
programs = ["cargo"]
args = { argv = "$.input.test_argv", cwd = "$.input.worktree" }

[[node]]
id = "route_retest"
kind = "route"
on = "$.payload.exit_code"
rules = [
  { eq = 0, port = "ok" },
  { port = "still_broken" },
]

# Retry path (verify-fix's proven shape): failure output feeds the agent.
[[node]]
id = "retry"
kind = "transform"
expr = "$.payload"

# The patch text, captured for the human approver.
[[node]]
id = "summarize"
kind = "tool"
tool = "run"
programs = ["git"]
args = { argv = ["git", "diff"], cwd = "$.input.worktree" }

# R4 (spec 33): the ledger row for a validated repair — gate_before/
# gate_after/patch_hash/model/tokens — written BEFORE the human gate so the
# evidence exists regardless of the approve/deny decision that follows.
[[node]]
id = "record_fixed"
kind = "ledger"
op = "heal.record_run"
gate_before = "fail"
gate_after = "pass"
fix_node = "fix"
diff_node = "summarize"

# Human gate: the ONLY way past this point. allow/deny both close the run;
# nothing here pushes, merges, or replaces the running daemon.
[[node]]
id = "escalate"
kind = "gate"
policy = "heal-escalation"
prompt = "heal-fix: the seeded break was repaired and the test passes in the disposable worktree (patch above). Approve to make the patch collectable via `xtask heal-collect`, or deny to discard. The main repo was never touched."
deadline_ms = 600000

[[node]]
id = "done"
kind = "transform"
join = "any"
value = "done"

[[edge]]
from = "probe"
port = "ok"
to = "route_probe"
kind = "data"

[[edge]]
from = "route_probe"
port = "ok"
to = "unexpected_ok"
kind = "data"

[[edge]]
from = "route_probe"
port = "broken"
to = "fix"
kind = "data"

[[edge]]
from = "fix"
port = "ok"
to = "retest"
kind = "data"

[[edge]]
from = "retest"
port = "ok"
to = "route_retest"
kind = "data"

[[edge]]
from = "route_retest"
port = "ok"
to = "summarize"
kind = "data"

[[edge]]
from = "route_retest"
port = "still_broken"
to = "retry"
kind = "data"

[[edge]]
from = "retry"
port = "ok"
to = "fix"
kind = "data"

[[edge]]
from = "summarize"
port = "ok"
to = "record_fixed"
kind = "data"

[[edge]]
from = "record_fixed"
port = "ok"
to = "escalate"
kind = "data"

[[edge]]
from = "escalate"
port = "allow"
to = "done"
kind = "data"

[[edge]]
from = "escalate"
port = "deny"
to = "done"
kind = "data"

[[edge]]
from = "unexpected_ok"
port = "allow"
to = "done"
kind = "data"

[[edge]]
from = "unexpected_ok"
port = "deny"
to = "done"
kind = "data"
