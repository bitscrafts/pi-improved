# Spec 207 demo: one `coder` node spawns the pi agent on a spec, and its verdict is the run of its criteria.
# Only the NAMES in env_pass are copied from the daemon's environment; no credential value lives in this file.
name = "coder-demo"
entry = "code"
caps = ["spawn", "proc"]

[limits]
# The 600000 ms default is checked before each next node, and a coder pass past ten minutes was failed with its work complete
# (measured on the daemon: 601 s and 717 s); the coder's timeout_ms is 1800000, so the wall is that plus 300000.
max_wall_ms = 2100000

[[node]]
id = "code"
kind = "coder"
caps = ["spawn", "proc"]
agent = "pi"
model = "@workhorse"
workdir = "/projects/pi-improved"
spec = "specs/207-the-coder-node-spawns-an-agent.md"
brief = "Implement the spec named above. Follow it as the contract."
timeout_ms = 1800000
env_pass = ["PATH", "HOME"]
criteria = ["cargo test -p pii-server --test coder_spawns_a_process"]

[[node]]
id = "done"
kind = "transform"
value = "done"

[[node]]
id = "refused"
kind = "refuse"
hook = "coder"
reason = "the agent failed"

[[edge]]
from = "code"
port = "ok"
to = "done"
kind = "data"

[[edge]]
from = "code"
port = "err"
to = "refused"
kind = "data"

# Spec 212: the podman guard is woven in at run start, pinned to the fragment's sha256.
[[attach]]
id = "guard"
fragment = "podman-guard"
at = "run.start"
pin = "5e1ff7772bf4f698553753c697e6b943a84604f38f5fdff867ee6aba98766f01"
