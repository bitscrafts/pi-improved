# Spec 207 demo (no fragment attach: the daemon cannot weave yet — row A87): one `coder` node spawns the pi agent on a spec, and its verdict is the run of its criteria.
# Only the NAMES in env_pass are copied from the daemon's environment; no credential value lives in this file.
name = "coder-demo"
entry = "code"
caps = ["spawn", "proc"]

[[node]]
id = "code"
kind = "coder"
caps = ["spawn", "proc"]
agent = "pi"
model = "deepseek-v4.1-flash:cloud"
provider = "ollama-cloud"
workdir = "/projects/pi-improved"
spec = "specs/207-the-coder-node-spawns-an-agent.md"
brief = "Implement the spec named above. Follow it as the contract."
env_pass = ["PATH", "HOME", "OLLAMA_API_KEY"]
criteria = ["cargo:test:pii-server/coder_spawns_a_process"]

[[node]]
id = "done"
kind = "transform"
value = "done"

[[node]]
id = "refused"
kind = "transform"
value = "refused"

[[edge]]
from = "code"
port = "ok"
to = "done"
kind = "data"

[[edge]]
from = "code"
port = "err"
to = "refused"
kind = "data"

# Spec 212: the podman guard is woven in at run start, pinned to the fragment's sha256.
