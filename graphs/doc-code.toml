# Spec 374: the documentation of the code, as a graph. Spec 393: its flow was `books`' flow with other commands, so it
# calls `books` (pinned by sha256) and supplies them: `doc-drift-inventory` lists the Rust modules that have no `//!`
# header, an empty list ends inside `books` on `nothing-to-do` and writes nothing, and `doc-drift-check --modules` proves
# the written documents true: every path and symbol they name must exist (the same tree walk as the HANDOFF check). No
# absolute path and no credential lives in this file: paths arrive through `input`.
name = "doc-code"
entry = "write"
# Spec 374 R5: declared so a night can call it, which routes the host on the exit node's ports.
exit = "done"
caps = ["spawn", "proc", "fs_read", "fs_write"]

[limits]
# The docs coder's 1200000 ms plus the two xtask walks; the 600000 ms default is checked before each next node.
max_wall_ms = 1800000

[[node]]
id = "write"
kind = "call"
graph = "books"
sha256 = "93cf8a72f2c2ca8fa24cb72025ac645da4bb93945d7ece5b24fd703050087a9e"
caps = ["spawn", "proc", "fs_read", "fs_write"]

[node.in]
inventory = ["cargo", "xtask", "doc-drift-inventory"]
verify = ["cargo", "xtask", "doc-drift-check", "--modules"]
programs = ["cargo"]
workdir = "$.input.workdir"
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"

[[node]]
id = "done"
kind = "transform"
value = "done"

# `unverified` is the honest middle: documents may exist, and are not proven.
[[node]]
id = "unverified"
kind = "refuse"
hook = "judge"
reason = "the written documentation names a path or symbol that does not exist, or could not be written"

[[edge]]
from = "write"
port = "ok"
to = "done"
kind = "data"

[[edge]]
from = "write"
port = "err"
to = "unverified"
kind = "data"
