# Spec 342: the night, as a composition of graphs pii already has.
#
# There is no `night_pick` and no `night_land` here. `queue` is called by pin (spec 255, extended by 343): the load
# inlines it and namespaces its ids (`sdd__select`, `sdd__record`), the run is ONE run with ONE journal, and a
# suspension inside the queue — a judge waiting on a gate, a timer — suspends the night at that node. The report is
# spec 128's `post`. Every kind in this file exists in a graph it composes: `timer`, `call`, `post`.
#
# `max_entries` must be at least the loop budget: the call is re-entered on every tick, and `max_entries` survives a
# resume (it is in the stored spec), so a night that outlives its budget dies on the next tick rather than looping
# forever.
name = "night"
entry = "tick"
exit = "report"
caps = ["spawn", "proc", "post", "fs_read", "fs_write"]

[limits]
# A night's ticks plus two coder passes plus a judge, checked before each next node.
max_wall_ms = 7200000

[[node]]
id = "tick"
kind = "timer"
in_ms = "$.input.in_ms"

# Spec 373: the node named `sdd` calls the SDD graph, so the name is true. `queue` stays a graph of its own for row work.
[[node]]
id = "sdd"
kind = "call"
graph = "sdd"
sha256 = "f2eeb3c22655fa5caea4dcd43d32d383849bdf876106e067114f7a97258719b4"
caps = ["spawn", "proc", "fs_read", "fs_write"]
max_entries = 12

[node.in]
agent = "$.input.agent"
model = "$.input.model"
provider = "$.input.provider"
spec = "$.input.spec"
base = "$.input.base"
workdir = "$.input.workdir"
docs_brief = "$.input.docs_brief"

[[node]]
id = "review"
kind = "transform"
# Spec 342 R5: the call's ok port carries both a claimed item and an empty queue; review passes the record through, and
# the report says which it was. Spec 381 R3: one of its three arms (ok, unverified, refused) arrives, so the join is any.
join = "any"
expr = "$.payload"

[[node]]
id = "report"
kind = "post"
caps = ["post"]
channel = "discord"
to = "$.input.to"
# Spec 381 R3: names what review carried, so a refused night says so.
template = "night: ${nodes.review}"
key = "night-${run}"
topic = "status"

[[edge]]
from = "tick"
port = "fired"
to = "sdd"
kind = "data"

[[edge]]
from = "sdd"
port = "ok"
to = "review"
kind = "data"

# Spec 381 R3: both refusals of the call reach the report, so a night that refused says so.
[[edge]]
from = "sdd"
port = "unverified"
to = "review"
kind = "data"

[[edge]]
from = "sdd"
port = "refused"
to = "review"
kind = "data"

[[edge]]
from = "review"
port = "ok"
to = "report"
kind = "data"
