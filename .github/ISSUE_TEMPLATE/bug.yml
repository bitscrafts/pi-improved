name: Bug
description: Something does not behave as documented.
labels: ["triage", "bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The commands you ran and their output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "Output of `git rev-parse --short HEAD`, or `pii --version`."
    validations:
      required: true
