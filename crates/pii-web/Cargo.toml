[package]
name = "pii-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Read-only web viewer: proxies the daemon's UDS JSON-RPC over loopback HTTP (P4.6)"

[dependencies]
pii-observe = { path = "../pii-observe" }
pii-proto = { path = "../pii-proto", features = ["client"] }
pii-uds = { path = "../pii-uds" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "net", "time"] }
axum = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
