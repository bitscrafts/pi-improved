[package]
name = "pii-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The one socket: grants, authorize, resolve-once-pin, HTTP/1.1 codec"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
rustls = { version = "0.23.44", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "1.0.9"

[features]
default = []
testing = []

[dev-dependencies]
rcgen = "0.14.10"
tempfile = { workspace = true }

[lints]
workspace = true
[dev-dependencies.pii-net]
path = "."
features = ["testing"]

# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
