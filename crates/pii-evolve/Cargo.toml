[package]
name = "pii-evolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-improving boss: state.md management + UDS launcher for the boss-watch graph (P4.7, spec 23/25/27, standalone opt-in)"

[dependencies]
pii-core = { path = "../pii-core" }
pii-proto = { path = "../pii-proto", features = ["client"] }
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
parking_lot = { workspace = true }

[lints]
workspace = true

# Zero doctests in this crate (```json annotation blocks aside), yet the doc
# phase is poisoned under `cargo test -j 2` by the cargo doctest fingerprint
# bug root-caused for pii-abi (spec 70 commit): rustdoc races dep rlib
# rebuilds and fails with E0463 "can't find crate". Nothing to lose; the lib
# and unit-test compilations cover the crate.
[lib]
doctest = false
