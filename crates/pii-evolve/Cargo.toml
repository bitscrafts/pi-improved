[package]
name = "pii-evolve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-improving boss: state.md management + UDS launcher for the boss-watch graph (P4.7, spec 23/25/27, standalone opt-in)"

[dependencies]
pii-core = { path = "../pii-core" }
pii-observe = { path = "../pii-observe" }
pii-proto = { path = "../pii-proto", features = ["client"] }
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
parking_lot = { workspace = true }

[lints]
workspace = true

# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
