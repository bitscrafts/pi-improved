[package]
name = "pii-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardware HAL: GPIO/I2C/SPI behind a claim + capability-scope contract, a simulated backend, one feature-gated real backend (spec 121)"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-observe = { path = "../pii-observe" }
parking_lot = { workspace = true }
# Optional, `hal-gpiod` only: the Linux GPIO character-device client (pure Rust).
gpiocdev = { version = "0.8", optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
# The real GPIO backend over /dev/gpiochipN. Compiled by the gate, never run on this host.
hal-gpiod = ["dep:gpiocdev"]

[lints]
workspace = true

[lib]
doctest = false
