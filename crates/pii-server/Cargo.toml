[package]
name = "pii-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pii daemon: engine, JSON-RPC dispatch, UDS/loopback transports"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
pii-store = { path = "../pii-store" }
pii-observe = { path = "../pii-observe" }
pii-graph = { path = "../pii-graph" }
pii-proto = { path = "../pii-proto" }
pii-model = { path = "../pii-model" }
pii-memory = { path = "../pii-memory" }
pii-hal = { path = "../pii-hal" }
pii-tools = { path = "../pii-tools" }
pii-net = { path = "../pii-net" }
pii-worker = { path = "../pii-worker" }
pii-channels = { path = "../pii-channels" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
dunce = { workspace = true }
blake3 = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "test-util"] }

[features]
testkit = []
# The real GPIO backend (spec 121): compiled by the gate, never run on this host.
hal-gpiod = ["pii-hal/hal-gpiod"]

[dev-dependencies]
tempfile = { workspace = true }
pii-proto = { path = "../pii-proto", features = ["client"] }
pii-net = { path = "../pii-net", features = ["testing"] }

[lints]
workspace = true
# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
