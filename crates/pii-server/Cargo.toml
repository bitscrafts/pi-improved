[package]
name = "pii-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pii daemon: engine, JSON-RPC dispatch, UDS/loopback transports"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
pii-store = { path = "../pii-store" }
pii-graph = { path = "../pii-graph" }
pii-proto = { path = "../pii-proto" }
pii-model = { path = "../pii-model" }
pii-memory = { path = "../pii-memory" }
pii-tools = { path = "../pii-tools" }
pii-net = { path = "../pii-net" }
pii-worker = { path = "../pii-worker" }
pii-channels = { path = "../pii-channels" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
parking_lot = { workspace = true }
dunce = { workspace = true }
blake3 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "test-util"] }

[features]
testkit = []

[dev-dependencies]
tempfile = { workspace = true }
pii-proto = { path = "../pii-proto", features = ["client"] }
pii-net = { path = "../pii-net", features = ["testing"] }

[lints]
workspace = true
# Zero doctests in this crate (```json annotation blocks aside), yet the doc
# phase is poisoned under `cargo test -j 2` by the cargo doctest fingerprint
# bug root-caused for pii-abi (spec 70 commit): rustdoc races dep rlib
# rebuilds and fails with E0463 "can't find crate". Nothing to lose; the lib
# and unit-test compilations cover the crate.
[lib]
doctest = false
