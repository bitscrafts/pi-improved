[package]
name = "pii-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

# THE ONLY crate that knows redb. Never add petgraph/toml here.
[dependencies]
pii-abi = { path = "../pii-abi" }
pii-observe = { path = "../pii-observe" }
serde = { workspace = true }
serde_json = { workspace = true }
redb = { workspace = true }
parking_lot = { workspace = true }
blake3 = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
