[package]
name = "pii-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# THE ONLY crate that knows redb. Never add petgraph/toml here.
[dependencies]
pii-abi = { path = "../pii-abi" }
serde = { workspace = true }
serde_json = { workspace = true }
redb = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# Zero doctests in this crate (```json annotation blocks aside), yet the doc
# phase is poisoned under `cargo test -j 2` by the cargo doctest fingerprint
# bug root-caused for pii-abi (spec 70 commit): rustdoc races dep rlib
# rebuilds and fails with E0463 "can't find crate". Nothing to lose; the lib
# and unit-test compilations cover the crate.
[lib]
doctest = false
