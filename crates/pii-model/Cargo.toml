[package]
name = "pii-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Model provider abstraction: scripted + HTTP chat backends"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
pii-observe = { path = "../pii-observe" }
serde = { workspace = true }
serde_json = { workspace = true }
llama-cpp-2 = { workspace = true, optional = true }
parking_lot = { workspace = true }
encoding_rs = "0.8"

[features]
# In-process llama.cpp provider; off by default so builds do not link llama.
llamacpp = ["dep:llama-cpp-2"]

[dev-dependencies]
tempfile = { workspace = true }
parking_lot = { workspace = true }
pii-net = { path = "../pii-net", features = ["testing"] }
rcgen = "0.14.10"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "logging", "std", "tls12"] }

[lints]
workspace = true

# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false

[[test]]
name = "real_granite"
required-features = ["llamacpp"]

[[example]]
name = "ds4_inprocess"
required-features = ["llamacpp"]
