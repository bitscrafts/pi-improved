[package]
name = "pii-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Model provider abstraction: scripted + HTTP chat backends"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
serde = { workspace = true }
serde_json = { workspace = true }
llama-cpp-2 = { workspace = true, optional = true }
parking_lot = { workspace = true }
encoding_rs = "0.8"

[features]
# In-process llama.cpp provider; off by default so builds do not link llama.
llamacpp = ["dep:llama-cpp-2"]

[dev-dependencies]
tempfile = { workspace = true }
parking_lot = { workspace = true }
pii-net = { path = "../pii-net", features = ["testing"] }

[lints]
workspace = true

# Zero doctests in this crate (```json annotation blocks aside), yet the doc
# phase is poisoned under `cargo test -j 2` by the cargo doctest fingerprint
# bug root-caused for pii-abi (spec 70 commit): rustdoc races dep rlib
# rebuilds and fails with E0463 "can't find crate". Nothing to lose; the lib
# and unit-test compilations cover the crate.
[lib]
doctest = false

[[test]]
name = "real_granite"
required-features = ["llamacpp"]

[[example]]
name = "ds4_inprocess"
required-features = ["llamacpp"]
