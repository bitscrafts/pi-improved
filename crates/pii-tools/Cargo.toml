[package]
name = "pii-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Built-in tools: fs read/write/edit, bash mediation, sandbox profiles"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-channels = { path = "../pii-channels" }
pii-core = { path = "../pii-core" }
pii-model = { path = "../pii-model" }
pii-observe = { path = "../pii-observe" }
pii-proto = { path = "../pii-proto", features = ["client"] }
pii-uds = { path = "../pii-uds" }
serde_json = { workspace = true }
dunce = { workspace = true }
landlock = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
