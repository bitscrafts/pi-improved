[package]
name = "pii-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in tools: fs read/write/edit, bash mediation, sandbox profiles"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
pii-model = { path = "../pii-model" }
pii-proto = { path = "../pii-proto", features = ["client"] }
pii-uds = { path = "../pii-uds" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
dunce = { workspace = true }
landlock = { workspace = true }
tokio = { workspace = true, features = ["rt", "io-util"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
# Zero doctests in this crate (```json annotation blocks aside), yet the doc
# phase is poisoned under `cargo test -j 2` by the cargo doctest fingerprint
# bug root-caused for pii-abi (spec 70 commit): rustdoc races dep rlib
# rebuilds and fails with E0463 "can't find crate". Nothing to lose; the lib
# and unit-test compilations cover the crate.
[lib]
doctest = false
