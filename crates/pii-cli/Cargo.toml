[package]
name = "pii-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "pii"
path = "src/main.rs"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
pii-store = { path = "../pii-store" }
pii-graph = { path = "../pii-graph" }
pii-proto = { path = "../pii-proto", features = ["client"] }
pii-server = { path = "../pii-server" }
pii-uds = { path = "../pii-uds" }
pii-worker = { path = "../pii-worker" }
pii-tools = { path = "../pii-tools" }
pii-tui = { path = "../pii-tui" }
serde_json = { workspace = true }
dunce = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
