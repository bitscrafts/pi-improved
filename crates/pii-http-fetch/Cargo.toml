[package]
name = "pii-http-fetch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Credential-free GET-only HTTP fetch tool routed through the pii-net chokepoint"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
pii-model = { path = "../pii-model" }
pii-net = { path = "../pii-net" }
parking_lot = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[dev-dependencies.pii-net]
path = "../pii-net"
features = ["testing"]

[lints]
workspace = true
# Zero doctests in this crate (```json annotation blocks aside), yet the doc
# phase is poisoned under `cargo test -j 2` by the cargo doctest fingerprint
# bug root-caused for pii-abi (spec 70 commit): rustdoc races dep rlib
# rebuilds and fails with E0463 "can't find crate". Nothing to lose; the lib
# and unit-test compilations cover the crate.
[lib]
doctest = false
