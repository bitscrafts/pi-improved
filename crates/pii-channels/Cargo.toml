[package]
name = "pii-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Channel polling: Discord + file-backed CLI channel (F6.1-F6.4)"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
