[package]
name = "pii-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Channel polling: Discord + file-backed CLI channel (F6.1-F6.4)"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# The doctest phase for this crate compiles with ZERO doctests (all crates
# forbid `print_stdout`/`unwrap_used` in doc examples), yet it is poisoned
# by the same cargo doctest fingerprint bug already root-caused for pii-abi:
# after the gate's `cargo check`/`clippy` stages rebuild dep rlibs, the doc
# phase reuses the lib's stale dep set and rustdoc fails with E0463
# "can't find crate for pii_abi/pii_core/serde_json" — so the shipped gate
# can never pass. There are no doctests to lose; lib/check/clippy/unit tests
# cover the crate (28 tests).
[lib]
doctest = false
