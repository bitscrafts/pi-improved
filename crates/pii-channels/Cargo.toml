[package]
name = "pii-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Channel polling: Discord, Telegram, Matrix, webhook + file-backed CLI channel"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
pii-observe = { path = "../pii-observe" }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
# MQTT 3.1.1 client (spec 117). default-features = false: no TLS, so rustls stays
# confined to pii-net (deps-check). Plain TCP only; see the mqtt module docs.
rumqttc = { version = "0.25.1", default-features = false }
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
pii-net = { path = "../pii-net", features = ["testing"] }
pii-store = { path = "../pii-store" }
pii-proto = { path = "../pii-proto" }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true

# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
