[package]
name = "pii-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP server + client: expose pii's tools to Hermes/other agents, and consume external MCP tool servers (P4.7)"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-core = { path = "../pii-core" }
pii-tools = { path = "../pii-tools" }
pii-proto = { path = "../pii-proto", features = ["client"] }
pii-server = { path = "../pii-server" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "net", "time"] }
rmcp = { version = "3.2", features = ["server", "client", "transport-io", "transport-child-process"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
