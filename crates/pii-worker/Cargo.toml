[package]
name = "pii-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Worker supervision and hot reload (F3.1-F3.6)"

[dependencies]
pii-abi = { path = "../pii-abi" }
pii-observe = { path = "../pii-observe" }
pii-core = { path = "../pii-core" }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[lints]
workspace = true

# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
