[package]
name = "pii-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Pii wire protocol: JSON-RPC 2.0 envelopes, methods, and events"

[dependencies]
# Optional: the transport CLIENT emits through the contract (spec 109 R7/R8). The default build is
# the wire types only, and invariant 2 (xtask deps-check) says its direct deps stay serde-only — so this
# rides the same `client` feature that already carries tokio.
pii-observe = { path = "../pii-observe", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util", "sync", "time", "rt"] }

[features]
default = []
client = ["dep:tokio", "dep:pii-observe"]

[lints]
workspace = true
# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "io-util", "time"] }
