[package]
name = "pii-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pii terminal UI: a pure protocol client (no engine, no graph)"

[dependencies]
pii-observe = { path = "../pii-observe" }
pii-proto = { path = "../pii-proto", features = ["client"] }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
[lib]
doctest = false
