[package]
name = "pii-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pii terminal UI: a pure protocol client (no engine, no graph)"

[dependencies]
pii-proto = { path = "../pii-proto", features = ["client"] }
ratatui = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# Zero doctests in this crate (```json annotation blocks aside), yet the doc
# phase is poisoned under `cargo test -j 2` by the cargo doctest fingerprint
# bug root-caused for pii-abi (spec 70 commit): rustdoc races dep rlib
# rebuilds and fails with E0463 "can't find crate". Nothing to lose; the lib
# and unit-test compilations cover the crate.
[lib]
doctest = false
