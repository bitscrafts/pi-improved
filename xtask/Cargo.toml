[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"
# Zero doctests (verified); the flag affects plain `cargo test` only — an explicit
# `--doc` (as the gate uses) ignores it. It avoids a cargo fingerprint problem in shared
# target dirs; it is not a gate workaround.
doctest = false

[dependencies]
serde_json = { workspace = true }
schemars = { workspace = true }
pii-proto = { path = "../crates/pii-proto" }
pii-store = { path = "../crates/pii-store" }
pii-memory = { path = "../crates/pii-memory" }
pii-core = { path = "../crates/pii-core" }
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
